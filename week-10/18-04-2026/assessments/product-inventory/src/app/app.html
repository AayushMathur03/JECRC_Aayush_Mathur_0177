<div class="container">
  <h1>Product Inventory</h1>

  <!-- ── Controls ── -->
  <div class="controls">

    <!-- Category dropdown -->
    <div class="control-group">
      <label for="category">Category</label>
      <select id="category" [(ngModel)]="selectedCategory">
        <option value="">-- All Categories --</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
      <button (click)="applyFilter()">Filter</button>
    </div>

    <!-- In-stock checkbox -->
    <div class="control-group">
      <label class="checkbox-label">
        <input
          type="checkbox"
          [(ngModel)]="showInStockOnly"
          (change)="onStockToggle()"
        />
        Show In-Stock Only
      </label>
    </div>

  </div>

  <!-- ── Table ── -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th class="sortable" (click)="sortByPrice()">
          Price ($)
          <span class="sort-icon">{{ priceSortAsc ? '▲' : '⇅' }}</span>
        </th>
        <th>Stock</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of filteredProducts">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.price | number:'1.2-2' }}</td>
        <td>{{ product.stock }}</td>
        <td>
          <span [class]="product.stock > 0 ? 'badge in-stock' : 'badge out-of-stock'">
            {{ product.stock > 0 ? 'In Stock' : 'Out of Stock' }}
          </span>
        </td>
      </tr>
      <tr *ngIf="filteredProducts.length === 0">
        <td colspan="6" class="no-data">No products found.</td>
      </tr>
    </tbody>
  </table>
</div>
