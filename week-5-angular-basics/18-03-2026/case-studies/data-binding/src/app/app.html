<h2> Product Order System</h2>

<!-- Interploation -->
<h3>{{ productName }}</h3>
<p>Price: ${{ price  }}</p>

<!-- Property Binding -->
<img [src]="imageUrl" width="200">

<br><br>

<!-- Event Binding -->
<button (click)="increaseQuantity()">+</button>
<button (click)="decreaseQuantity()">-</button>
<p>Quantity: {{ quantity }}</p>
<!-- <p>Total: ${{ getTotal() }}</p> -->

<br> 

<!-- property =event -->

<button [disabled]= "!isAvailable" (click)="  toggleAvailability()">
  {{isAvailable ? 'In Stock' : 'Out of Stock'}}</button>

  <br><br>


  <!-- Two way binding -->

  <h3> Customer Details</h3>
  <input type ="text" [(ngModel)]="customerName" placeholder="Enter your name">

  <br><br>

  <textarea [(ngModel)]="address" placeholder="Enter your address"></textarea>
  <br><br>

  <!-- Interpolation -->
  <h3> Order Summary</h3>
  <p>Name: {{ customerName }}</p>
  <p>Address: {{ address }}</p>
  <p>Total Amount: ${{ getTotal() }}</p>
