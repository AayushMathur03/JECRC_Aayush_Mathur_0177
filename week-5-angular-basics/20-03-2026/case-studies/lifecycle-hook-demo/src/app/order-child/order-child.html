<h2>Order Details (Child)</h2>

<div class="card">
  <p><b>Order ID:</b> {{ orderData.id }}</p>
  <p><b>Product:</b> {{ orderData.productName }}</p>
  <p><b>Status:</b> {{ orderData.status }}</p>

  <hr>

 <h3>Lifecycle Logs (Live UI)</h3>

<div class="log-box">
    <div *ngFor="let log of logs">
        {{log}}
    </div>
</div>
