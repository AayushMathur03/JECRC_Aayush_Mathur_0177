<div style="padding: 24px;">
  <h2>Available Courses</h2>

  <div *ngFor="let course of courses"
       style="border: 1px solid #ddd; border-radius: 8px;
              padding: 16px; margin-bottom: 16px; cursor: pointer;"
       (click)="viewDetails(course.id)">

    <h3 style="margin: 0 0 8px;">{{ course.title }}</h3>
    <p style="margin: 4px 0;">Instructor: {{ course.instructor }}</p>
    <p style="margin: 4px 0;">Duration: {{ course.duration }}</p>
    <button style="margin-top: 10px; padding: 6px 16px;
                   background: #1a1a2e; color: white;
                   border: none; border-radius: 4px; cursor: pointer;">
      View Details
    </button>
  </div>
</div>
