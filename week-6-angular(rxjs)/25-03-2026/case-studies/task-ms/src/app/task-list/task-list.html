<div class="list-card">

  <!-- Header -->
  <div class="list-header">
    <div class="list-title-block">
      <h2 class="list-title">Task Board</h2>
      <div class="list-stats">
        <span class="stat pending">{{ pendingCount }} pending</span>
        <span class="stat-divider">·</span>
        <span class="stat done">{{ completedCount }} done</span>
      </div>
    </div>
    <button class="refresh-btn" (click)="loadTasks()" title="Refresh">↻</button>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <span class="search-icon">⌕</span>
    <input
      type="text"
      class="search-input"
      placeholder="Search tasks..."
      [value]="searchTerm"
      (input)="onSearch($any($event.target).value)"
    />
  </div>

  <!-- Filters -->
  <div class="filters">
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'all'"
      (click)="setFilter('all')"
    >All</button>
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'pending'"
      (click)="setFilter('pending')"
    >Pending</button>
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'completed'"
      (click)="setFilter('completed')"
    >Completed</button>
  </div>

  <!-- Loading -->
  <div class="state-block" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading tasks…</p>
  </div>

  <!-- Error -->
  <div class="state-block error-state" *ngIf="errorMessage && !isLoading">
    <span class="state-icon">⚠</span>
    <p>{{ errorMessage }}</p>
    <button class="retry-btn" (click)="loadTasks()">Try again</button>
  </div>

  <!-- Empty -->
  <div class="state-block" *ngIf="!isLoading && !errorMessage && filteredTasks.length === 0">
    <span class="state-icon">◎</span>
    <p>No tasks found</p>
  </div>

  <!-- Task Items -->
  <ul class="task-list" *ngIf="!isLoading && filteredTasks.length > 0">
    <li
      class="task-item"
      *ngFor="let task of filteredTasks"
      [class.completed]="task.completed"
      [class.deleting]="task.id && deletingIds.has(task.id)"
    >
      <!-- Checkbox -->
      <button
        class="check-btn"
        [class.checked]="task.completed"
        [class.spinning]="task.id && togglingIds.has(task.id)"
        (click)="toggleComplete(task)"
        [disabled]="(task.id && togglingIds.has(task.id)) || false"
        title="{{ task.completed ? 'Mark as pending' : 'Mark as complete' }}"
      >
        <span class="check-icon" *ngIf="task.completed && !(task.id && togglingIds.has(task.id))">✓</span>
        <span class="check-spinner" *ngIf="task.id && togglingIds.has(task.id)"></span>
      </button>

      <!-- Content -->
      <div class="task-content">
        <span class="task-title">{{ task.title }}</span>
        <span class="task-id">ID: {{ task.id }}</span>
      </div>

      <!-- Status badge -->
      <span class="status-badge" [class.done]="task.completed">
        {{ task.completed ? 'Done' : 'Pending' }}
      </span>

      <!-- Actions -->
      <div class="task-actions">
        <button
          class="action-btn edit"
          (click)="editTask(task)"
          title="Edit task"
        >✎</button>
        <button
          class="action-btn delete"
          (click)="deleteTask(task)"
          [disabled]="(task.id && deletingIds.has(task.id)) || false"
          title="Delete task"
        >✕</button>
      </div>
    </li>
  </ul>

</div>
