<div class="filter-bar">
  <input
    type="date"
    [(ngModel)]="selectedDate"
    class="date-input"
  />
  <button class="filter-btn" (click)="onFilter()">Filter</button>
</div>

<div class="table-wrapper">
  <table class="transaction-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Type</th>
        <th class="sortable" (click)="sortByAmount()">
          Amount ($) <span class="sort-icon">▲</span>
        </th>
        <th>Available Balance</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let txn of transactions">
        <td>{{ txn.date }}</td>
        <td>{{ txn.description }}</td>
        <td>{{ getTypeName(txn.type) }}</td>
        <td>{{ txn.amount }}</td>
        <td>{{ txn.balance }}</td>
      </tr>
      <tr *ngIf="transactions.length === 0">
        <td colspan="5" class="no-data">No transactions found.</td>
      </tr>
    </tbody>
  </table>
</div>
