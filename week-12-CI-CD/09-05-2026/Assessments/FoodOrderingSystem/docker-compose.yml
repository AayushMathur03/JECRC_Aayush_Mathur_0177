version: '3.8'

services:

  sqlserver:

    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

    volumes:
      - sqldata:/var/opt/mssql

  web:

    build:
      context: .
      dockerfile: FoodOrdering.Web/Dockerfile

    ports:
      - "7070:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FoodOrderingDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True

    depends_on:
      - sqlserver

volumes:
  sqldata: